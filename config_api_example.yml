# Master configuration for evaluating models via API (e.g., vLLM server with LoRA)
run_settings:
  task_name: "Prover LoRA Evaluation via vLLM Server"
  description: "Evaluates the prover LoRA model served via vLLM API server"
  tasks_to_run:
    - "minif2f"        # Lean 4 theorem proving (MiniF2F test split)

# Model configuration for API-based inference
models:
  - model_name: "prover"  # Name of the LoRA adapter in your vLLM server
    path: "Qwen/Qwen3-32B"  # Base model path (used for display/logging)
    type: "base"
    description: "Prover model with LoRA adapter served via vLLM"
    location: "api"
    # API-specific settings
    api_base: "http://localhost:8000/v1"  # Your vLLM server URL
    api_model_name: "prover"  # Name that matches your --lora-modules argument
    tokenizer_path: "Qwen/Qwen3-32B"  # Path to tokenizer (for prompt formatting)

# General settings applicable to all evaluations.
evaluation_settings:
  gpu_ids: "0"  # Not used for API mode, but required field
  timeout_minutes: 120  # Increased for theorem proving
  batch_size: 1
  temperature: 0.0
  runs_per_eval: 1
  output_dir: "./evaluation_results"
  verbose: true
  clear_screen: false
  
  # MiniF2F-specific settings (for theorem proving tasks)
  minif2f_settings:
    num_samples: 32  # Number of proof samples per problem (Pass@N)
    num_samples_correction: 2
    num_cpus: 64
    max_correction_rounds: 0  # No self-correction for now
    inference_handler: "dpskcot"  # CoT inference handler
    temperature: 1.0
    max_model_len: 40960
    dataset_path: "dataset/test.jsonl"

# Configuration for environments and paths to evaluation scripts.
environment_config:
  harness_env: "harness_env"
  languages_env: "languages_env"
  goedelv2_env: "goedelv2"
  math_harness_dir: "./vendor/math-evaluation-harness"
  language_eval_dir: "./vendor/HumanEval"
  goedel_prover_dir: "./vendor/goedel-prover"
